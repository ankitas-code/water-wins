<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#dff5ff"><title>Water Wins 💧</title>
<style>
:root{font-family:ui-rounded,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#12374c;background:#eaf8ff}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 15% 10%,#fff 0,transparent 45%),linear-gradient(160deg,#e9f9ff,#d4eeff);display:grid;place-items:center;padding:20px}.app{width:min(100%,440px);background:#ffffffdc;border:1px solid #fff;border-radius:32px;box-shadow:0 20px 65px #4c94bd30;padding:28px 24px;text-align:center;position:relative;overflow:hidden}h1{font-size:32px;letter-spacing:-1.5px;margin:12px 0 4px}p{color:#557488}.drop{font-size:70px;filter:drop-shadow(0 10px 8px #75c6eb66)}.eyebrow{font-weight:700;font-size:12px;letter-spacing:2px;color:#398db5;text-transform:uppercase}.count{font-size:68px;font-weight:850;line-height:1.05;letter-spacing:-3px;margin:22px 0 0}.sub{font-size:14px;margin:4px 0 24px}.progress{height:16px;border-radius:20px;background:#dceef8;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#4cb5e7,#197bc6);border-radius:20px;transition:width .5s}.goal{font-size:13px;margin:8px 0 24px}button{font:inherit;cursor:pointer;border:0}.primary{width:100%;border-radius:20px;background:#117bc4;color:white;padding:19px;font-size:18px;font-weight:800;box-shadow:0 9px 22px #258aca40}.primary:active{transform:scale(.98)}.secondary{background:#e8f5fc;color:#286a92;border-radius:14px;padding:12px 16px;font-weight:700}.actions{display:flex;gap:10px;justify-content:center;margin-top:16px}.celebrate{min-height:52px;font-weight:750;color:#0879b9;margin:14px 0 0}.history{border-top:1px solid #e0edf4;margin-top:16px;padding-top:15px;text-align:left}.history h2{font-size:15px;margin:0 0 10px}.historyrow{display:flex;justify-content:space-between;font-size:14px;padding:7px 0;color:#44677b}.settings{display:flex;align-items:center;justify-content:center;gap:10px;font-size:13px;color:#53798e;margin-top:12px}input{width:62px;border:1px solid #b8d9e9;border-radius:10px;padding:7px;font:inherit;text-align:center;color:#12374c}.confetti{position:absolute;pointer-events:none;top:-20px;font-size:22px;animation:fall 1.6s ease-in forwards}@keyframes fall{to{transform:translateY(650px) rotate(620deg);opacity:0}}.foot{font-size:11px;line-height:1.5;margin:18px 0 0}@media(prefers-reduced-motion:reduce){.confetti{display:none}.fill{transition:none}}
</style>
</head>
<body><main class="app" id="app"><div class="eyebrow">Little sips, big wins</div><div class="drop" aria-hidden="true">💧</div><h1>Water Wins!</h1><p>Hydration looks good on you.</p><div class="count" id="count">0</div><p class="sub">glasses today</p><div class="progress" role="progressbar" aria-label="Daily water goal" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress"><div class="fill" id="fill"></div></div><p class="goal" id="goalText">0 of 8 glasses</p><button class="primary" id="add">💦 Log a glass</button><div class="celebrate" id="message" aria-live="polite">Ready for your first sip?</div><div class="actions"><button class="secondary" id="undo">↶ Undo last</button><button class="secondary" id="export">↓ Export history</button></div><div class="settings"><label for="goal">Daily goal (glasses)</label><input id="goal" type="number" min="1" max="30" value="8"></div><section class="history"><h2>Last 7 days</h2><div id="history"></div></section><p class="foot">Saved on this device in this browser. Use Safari each time. Opening the NFC link doesn't automatically log a drink; tap the button to confirm.</p></main>
<script>
(()=>{'use strict';const KEY='water-wins-v1';let data;try{data=JSON.parse(localStorage.getItem(KEY))||{goal:8,logs:{}}}catch{data={goal:8,logs:{}}}if(!data.logs||typeof data.logs!=='object')data.logs={};data.goal=Math.min(30,Math.max(1,Number(data.goal)||8));const $=id=>document.getElementById(id);const dayKey=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch{$('message').textContent='Storage unavailable. Your history may not persist.'}};function render(){const today=dayKey(),n=(data.logs[today]||[]).length;const pct=Math.min(100,Math.round(n/data.goal*100));$('count').textContent=n;$('fill').style.width=pct+'%';$('progress').setAttribute('aria-valuenow',pct);$('goalText').textContent=`${n} of ${data.goal} glasses · ${pct}% of goal`;$('goal').value=data.goal;$('undo').disabled=n===0;$('undo').style.opacity=n===0?'.45':'1';$('history').replaceChildren();for(let i=0;i<7;i++){let d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-i);let key=dayKey(d),row=document.createElement('div');row.className='historyrow';let name=document.createElement('span'),value=document.createElement('strong');name.textContent=i===0?'Today':d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});value.textContent=`${(data.logs[key]||[]).length} ${((data.logs[key]||[]).length===1)?'glass':'glasses'}`;row.append(name,value);$('history').append(row)}}function confetti(){let app=$('app');for(let i=0;i<24;i++){const s=document.createElement('span');s.className='confetti';s.textContent=['💧','✨','🎉','🫧'][i%4];s.style.left=Math.random()*95+'%';s.style.animationDelay=Math.random()*.3+'s';app.append(s);setTimeout(()=>s.remove(),2100)}}$('add').addEventListener('click',()=>{const key=dayKey();if(!Array.isArray(data.logs[key]))data.logs[key]=[];data.logs[key].push(new Date().toISOString());save();render();const n=data.logs[key].length;$('message').textContent=n>=data.goal?'🏆 Goal reached! You absolute legend!':'🎉 Well done for drinking your water!';confetti()});$('undo').addEventListener('click',()=>{const key=dayKey();if(data.logs[key]?.length){data.logs[key].pop();save();render();$('message').textContent='Last glass removed.'}});$('goal').addEventListener('change',()=>{data.goal=Math.min(30,Math.max(1,Math.round(Number($('goal').value)||8)));save();render()});$('export').addEventListener('click',()=>{let lines=['date,time_utc'];Object.keys(data.logs).sort().forEach(day=>(data.logs[day]||[]).forEach(time=>lines.push(`${day},${time}`)));const blob=new Blob([lines.join('\n')],{type:'text/csv'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='water-history.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});render()})();
</script></body></html>
